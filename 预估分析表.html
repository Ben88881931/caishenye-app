<script>
var RAW = {"1": "0111000111", "2": "0111110110", "3": "1010110101", "4": "0010011101", "5": "1001001101", "6": "0101011000", "7": "1100110010", "8": "0100011001", "9": "0010001111", "10": "1101100111", "11": "1110010110", "12": "1101011000", "13": "0100101101", "14": "0111001010", "15": "1101010010", "16": "1010101010", "17": "0111100010", "18": "1111010001", "19": "0010011101", "20": "0110100101", "21": "1011110100", "22": "1000001111", "23": "0100001111", "24": "1001110010", "25": "1100101101", "26": "0011100101", "27": "1100011011", "28": "0011000111", "29": "0101110110", "30": "0101111100", "31": "0100011111", "32": "1101001101", "33": "0111101010", "34": "1001110011", "35": "0110101101", "36": "1100100111", "37": "0011110001", "38": "1010101001", "39": "1100100011", "40": "0100001111", "41": "0010101110", "42": "0110001111", "43": "1011010001", "44": "0000001111", "45": "1111000110", "46": "1011001001", "47": "1011011101", "48": "0010101011", "49": "0111000011", "50": "1001100100", "51": "1110101010", "52": "1001111010", "53": "0111011110", "54": "1110000111", "55": "1100100011", "56": "1000011111", "57": "1101101001", "58": "1101000010", "59": "1011100011", "60": "1100110101", "61": "0010011111", "62": "0010111001", "63": "0110101110", "64": "1011100010", "65": "0011110110", "66": "1010101110", "67": "1100011001", "68": "0111001011", "69": "1001101010", "70": "1101010100", "71": "1100110010", "72": "0110111010", "73": "0101101101", "74": "1110110001", "75": "1111001101", "76": "0111100100", "77": "1010011101", "78": "1011001110", "79": "1001111001", "80": "0111000111", "81": "0100111100", "82": "0101010100", "83": "1101011010", "84": "1110111100", "85": "1001101101", "86": "0010111000", "87": "0110001101", "88": "1010001110", "89": "0110111001", "90": "1010001111", "91": "0010110110", "92": "0010011110", "93": "1001101110", "94": "0001111110", "95": "0100010011", "96": "0001011100", "97": "0100101011", "98": "0011100111", "99": "1010000110", "100": "0011110010", "101": "1010100011", "102": "1011001101", "103": "1101101001", "104": "1101010011", "105": "0110101111", "106": "1110011010", "107": "1101111001", "108": "1000111010", "109": "0001101111", "110": "1001010001", "111": "0101100010", "112": "1000110101", "113": "0010010101", "114": "1100011000", "115": "0100111111", "116": "1011011010", "117": "0011011101", "118": "1010001111", "119": "1110000010", "120": "1001101110", "121": "1100111010", "122": "0111010010", "123": "0011101101", "124": "1010011101", "125": "1100001111", "126": "1101010001", "127": "0001110111", "128": "0010011100", "129": "1100110100", "130": "0100011001", "131": "1110010100", "132": "1100110001", "133": "0101101110", "134": "1010101101", "135": "1000010111", "136": "0110110110", "137": "1010111101", "138": "1010101011", "139": "1100111010", "140": "1011101000", "141": "0011100110", "142": "0101011010", "143": "0011101010", "144": "0111001101", "145": "0011011110", "146": "1110011001", "147": "1101001011", "148": "0101100110", "149": "1000110110", "150": "0110110001", "151": "1110010101", "152": "0100111100", "153": "1101001010", "154": "0111101010", "155": "1101001100", "156": "0111001100", "157": "1101010100", "158": "0111001010", "159": "0010101111", "160": "1110001011", "161": "1010101011", "162": "0111101100", "163": "1101000111", "164": "0111101010", "165": "0111000101", "166": "1100111010", "167": "1101000101", "168": "1101110100", "169": "1010100110", "170": "1001101110", "171": "1110101010", "172": "0010110110", "173": "1001001001", "174": "0101110010", "175": "1000011111", "176": "1110011010", "177": "0110110001", "178": "0110101110", "179": "1100011001", "180": "1100100101", "181": "0000111101", "182": "0101110001", "183": "0011101101", "184": "1100111000", "185": "1010011011", "186": "0111010111", "187": "0111001110", "188": "1100111011", "189": "1011010110", "190": "0000101111", "191": "0001101001", "192": "1100010110", "193": "0110010001", "194": "1110111000", "195": "0001111001", "196": "1101100101", "197": "1000100011", "198": "0110110110", "199": "0010011111", "200": "0011011001", "201": "0110011011", "202": "1101010100", "203": "0111100100", "204": "1110011100", "205": "1111001111", "206": "1001010101", "207": "1101101101", "208": "1001010111", "209": "0110110011", "210": "1010010111", "211": "0111000111", "212": "0011001101", "213": "0110010001", "214": "1101100111", "215": "1101100011", "216": "0110111110", "217": "1110101100", "218": "0011001110", "219": "0111000111", "220": "0010110111", "221": "0100101010", "222": "0000101111", "223": "0101100011", "224": "0000011011", "225": "1100100111", "226": "0101100111", "227": "0101101101", "228": "0001001011", "229": "0101011110", "230": "1000101111", "231": "1101001011","232":"1010101101","233":"0100110111"};

var N = 233;
var ws = [5, 7, 10, 15, 20, 27, 30];
var predWs = [5, 7, 10, 15];
var compareWs = [20, 27, 30];

function calcSegInfo(w) {
    var total_segs = Math.ceil(N / w);
    var cur_start = (total_segs - 1) * w + 1;
    var cur_end = N;
    var prev1_start = (total_segs - 2) * w + 1;
    var prev1_end = (total_segs - 1) * w;
    var prev2_start = (total_segs - 3) * w + 1;
    var prev2_end = (total_segs - 2) * w;
    return {
        total: total_segs,
        cur: {start: cur_start, end: cur_end},
        prev1: {start: prev1_start, end: prev1_end},
        prev2: {start: prev2_start, end: prev2_end}
    };
}

function cntRange(d, start, end) {
    var cnt = 0;
    for (var p = start; p <= end; p++) {
        if (RAW[p] && RAW[p][d] == '1') cnt++;
    }
    return cnt;
}

function calcPredict(d, w, curCnt) {
    var total_segs = Math.ceil(N / w);
    var similar_nexts = [];
    var all_nexts = [];
    for (var seg = 1; seg < total_segs; seg++) {
        var seg_start = (seg - 1) * w + 1;
        var seg_end = seg * w;
        var seg_cnt = cntRange(d, seg_start, seg_end);
        var next_start = seg * w + 1;
        var next_end = Math.min((seg + 1) * w, N);
        var next_cnt = cntRange(d, next_start, next_end);
        all_nexts.push(next_cnt);
        if (seg_cnt == curCnt) {
            similar_nexts.push(next_cnt);
        }
    }
    if (similar_nexts.length == 0) {
        // 找不到相似段时，用历史平均值
        if (all_nexts.length == 0) return {ml: 0, s: 0};
        var sum = all_nexts.reduce(function(a, b) { return a + b; }, 0);
        var avg = Math.round(sum / all_nexts.length);
        return {ml: avg, s: all_nexts.length, avg: true};
    }
    var dist = {};
    similar_nexts.forEach(function(cnt) { dist[cnt] = (dist[cnt] || 0) + 1; });
    var most_likely = 0, max_count = 0;
    for (var cnt in dist) {
        if (dist[cnt] > max_count) { max_count = dist[cnt]; most_likely = parseInt(cnt); }
    }
    return {ml: most_likely, s: similar_nexts.length};
}

function bg(r) {
    if (r >= 0.7) return "hot";
    if (r >= 0.6) return "warm";
    if (r >= 0.5) return "norm";
    if (r >= 0.4) return "cool";
    if (r >= 0.3) return "cold";
    return "ice";
}

function fill() {
    var thead = document.getElementById("thead");
    var tbody = document.getElementById("b");
    
    var h = '<tr><th class="d0">尾</th>';
    ws.forEach(function(w, i) {
        var info = calcSegInfo(w);
        h += '<th colspan="3">' + w + '期段口<br><span style="font-size:8px;font-weight:normal;color:#222">' + info.total + '段(' + info.cur.start + '-' + info.cur.end + '期)</span></th>';
        if (i < ws.length - 1) h += '<th class="gap"></th>';
    });
    h += '</tr><tr><th class="d0">号</th>';
    
    ws.forEach(function(w, i) {
        var info = calcSegInfo(w);
        var isPred = predWs.indexOf(w) >= 0;
        var label3 = isPred ? '预估' : '当前';
        h += '<th class="d">前2<br><span style="font-size:7px;font-weight:normal;color:#222">' + info.prev2.start + '-' + info.prev2.end + '</span></th>';
        h += '<th class="d">前1<br><span style="font-size:7px;font-weight:normal;color:#222">' + info.prev1.start + '-' + info.prev1.end + '</span></th>';
        h += '<th class="d">' + label3 + '</th>';
        if (i < ws.length - 1) h += '<th class="gap"></th>';
    });
    h += '</tr>';
    thead.innerHTML = h;
    
    h = '';
    for (var d = 0; d < 10; d++) {
        h += '<tr><td class="d0">尾' + d + '</td>';
        ws.forEach(function(w, i) {
            var info = calcSegInfo(w);
            var p2 = cntRange(d, info.prev2.start, info.prev2.end);
            var p1 = cntRange(d, info.prev1.start, info.prev1.end);
            var cur = cntRange(d, info.cur.start, info.cur.end);
            var isPred = predWs.indexOf(w) >= 0;
            
            h += '<td class="d ' + bg(p2/w) + '">' + p2 + '</td>';
            var a1 = p1 > p2 ? '<span class="arr">+' + (p1-p2) + '</span>' : p1 < p2 ? '<span class="arr">' + (p1-p2) + '</span>' : '';
            h += '<td class="d ' + bg(p1/w) + '">' + p1 + a1 + '</td>';
            
            if (isPred) {
                var pred = calcPredict(d, w, cur);
                if (pred.s > 0) {
                    var dif = pred.ml - p1;
                    var ds = dif > 0 ? '+' + dif : dif < 0 ? String(dif) : '0';
                    var label = pred.avg ? '均值' : pred.s + '样本';
                    h += '<td class="d ' + bg(pred.ml/w) + '">' + pred.ml + '<span class="arr">' + ds + '</span><span class="sm">' + label + '</span></td>';
                } else {
                    h += '<td class="d" style="color:#222">--</td>';
                }
            } else {
                var ac = cur > p1 ? '<span class="arr">+' + (cur-p1) + '</span>' : cur < p1 ? '<span class="arr">' + (cur-p1) + '</span>' : '';
                h += '<td class="d ' + bg(cur/w) + '">' + cur + ac + '</td>';
            }
            
            if (i < ws.length - 1) h += '<td class="gap"></td>';
        });
        h += '</tr>';
    }
    tbody.innerHTML = h;
}
fill();

// 三层分析框架
var bounceThreshold = {0:4, 1:4, 2:5, 3:4, 4:4, 5:3, 6:2, 7:5, 8:2, 9:1};

function getMiss(d) {
    var miss = 0;
    for (var p = N; p >= 1; p--) {
        if (RAW[p] && RAW[p][d] == '0') miss++;
        else break;
    }
    return miss;
}

function getDirection(cnt15, miss, bt) {
    if (cnt15 >= 10) return '热惯性';
    if (cnt15 <= 5) {
        if (miss >= bt) return '🔥超临界';
        return '冷反弹';
    }
    return '中';
}

function fillThreeLayer() {
    var tbody = document.getElementById('threeLayerBody');
    if (!tbody) return;
    var html = '';
    var candidates = [];
    
    for (var d = 0; d < 10; d++) {
        var cnt15 = cntRange(d, N-14, N);
        var cnt5 = cntRange(d, N-4, N);
        var cnt7 = cntRange(d, N-6, N);
        var cnt10 = cntRange(d, N-9, N);
        var miss = getMiss(d);
        var bt = bounceThreshold[d];
        var dir = getDirection(cnt15, miss, bt);
        
        var s15 = cnt15 >= 10 ? '热' : (cnt15 <= 5 ? '冷' : '中');
        var s5 = cnt5 >= 4 ? '热' : (cnt5 <= 1 ? '冷' : '中');
        
        var bg15 = cnt15 >= 10 ? '#22c55e' : (cnt15 <= 5 ? '#ef4444' : '#94a3b8');
        var bg5 = cnt5 >= 4 ? '#22c55e' : (cnt5 <= 1 ? '#ef4444' : '#94a3b8');
        
        var score = 0;
        if (cnt15 <= 5) score += 3;
        if (cnt5 <= 1) score += 2;
        if (miss >= bt) score += 5;
        else if (miss >= bt - 1) score += 2;
        
        // 只推荐未出的号
        var lastBin = RAW[N] || '';
        var isMissed = lastBin[d] == '0';
        if (isMissed) {
            candidates.push({d:d, miss:miss, cnt15:cnt15, cnt5:cnt5, bt:bt, score:score, dir:dir});
        }
        
        html += '<tr>';
        html += '<td style="padding:4px;border:1px solid #e8e4f0;font-weight:bold">尾' + d + '</td>';
        html += '<td style="padding:4px;border:1px solid #e8e4f0;background:' + bg15 + ';color:#fff">' + cnt15 + '/15 ' + s15 + '</td>';
        html += '<td style="padding:4px;border:1px solid #e8e4f0;background:' + bg5 + ';color:#fff">' + cnt5 + '/5 ' + s5 + '</td>';
        html += '<td style="padding:4px;border:1px solid #e8e4f0">' + cnt7 + '/7</td>';
        html += '<td style="padding:4px;border:1px solid #e8e4f0">' + cnt10 + '/10</td>';
        html += '<td style="padding:4px;border:1px solid #e8e4f0">' + miss + '期</td>';
        html += '<td style="padding:4px;border:1px solid #e8e4f0">' + bt + '期</td>';
        html += '<td style="padding:4px;border:1px solid #e8e4f0">' + dir + '</td>';
        html += '</tr>';
    }
    tbody.innerHTML = html;
    
    // 推荐排序
    candidates.sort(function(a, b) { return b.score - a.score; });
    var recDiv = document.getElementById('recommendation');
    if (!recDiv) return;
    
    if (candidates.length == 0) {
        recDiv.innerHTML = '<div style="color:#999">上期全中，无未出号，建议跳过</div>';
        return;
    }
    
    var top = candidates[0];
    var recHtml = '<div style="font-size:16px;font-weight:bold;color:#6c5ce7;margin-bottom:8px">首选：尾' + top.d + '</div>';
    recHtml += '<div style="font-size:11px;color:#666;margin-bottom:4px">遗漏' + top.miss + '期 | 15段' + top.cnt15 + '/15 | 近5期' + top.cnt5 + '/5 | 临界' + top.bt + '期</div>';
    recHtml += '<div style="font-size:12px;color:#222;margin-bottom:8px">方向：' + top.dir + '</div>';
    
    if (candidates.length >= 2) {
        var sec = candidates[1];
        recHtml += '<div style="font-size:12px;color:#888;margin-top:8px">备选：尾' + sec.d + ' (遗漏' + sec.miss + '期 | 15段' + sec.cnt15 + '/15)</div>';
    }
    
    recDiv.innerHTML = recHtml;
}

fillThreeLayer();
</script>
