<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.4, maximum-scale=3.0">
    <title>财神爷数据记录系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            font-size: 18px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            text-align: center;
        }
        
        .header h1 {
            color: #667eea;
            font-size: 42px;
            margin-bottom: 10px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 18px 36px;
            background: rgba(255,255,255,0.3);
            border: none;
            border-radius: 12px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            font-weight: bold;
        }
        
        .tab:hover {
            background: rgba(255,255,255,0.5);
        }
        
        .tab.active {
            background: white;
            color: #667eea;
        }
        
        .page {
            display: none;
        }
        
        .page.active {
            display: block;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-card h3 {
            color: #666;
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        .stat-card .value {
            font-size: 44px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-card .label {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .card h2 {
            color: #667eea;
            font-size: 24px;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c0392b;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        table th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }
        
        table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }
        
        table tr:hover {
            background: #f8f9fa;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .badge-success {
            background: #27ae60;
            color: white;
        }
        
        .badge-warning {
            background: #f39c12;
            color: white;
        }
        
        .badge-danger {
            background: #e74c3c;
            color: white;
        }
        
        .period-list {
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>

    <div class="container">
        <div class="header">
            <h1>📊 财神爷数据记录系统</h1>
            <p>三期内必出规律分析</p>

        <div class="tabs">

            <div class="card">

                <div class="form-group">
                    <label>期数</label>
                    <input type="number" id="periodInput" placeholder="例如：211">
                </div>
                <div class="form-group">

                </div>
                <div class="period-list">
                    <table>
                        <thead>

                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="periodTable">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <!-- 规律分析页 -->

    </div>

        let data = JSON.parse(localStorage.getItem('lotteryData')) || initialData;
        
        function saveData() {
            localStorage.setItem('lotteryData', JSON.stringify(data));
        }
        
        function switchPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            
            document.getElementById(page + 'Page').classList.add('active');
            event.target.classList.add('active');
        }
        
        function addPeriod() {
            const periodInput = document.getElementById('periodInput');
            const numbersInput = document.getElementById('numbersInput');
            
            const period = parseInt(periodInput.value);
            const numbers = numbersInput.value.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n));
            
            if (!period || numbers.length === 0) {
                alert('请输入期数和开奖号码');
                return;
            }
            
            data[period] = numbers.sort((a, b) => a - b);
            saveData();
            
            periodInput.value = '';
            numbersInput.value = '';
            
            updateUI();
            alert(`已添加第${period}期：${data[period].join(', ')}`);
        }
        
        function deletePeriod(period) {
            if (confirm(`确定删除第${period}期吗？`)) {
                delete data[period];
                saveData();
                updateUI();
            }
        }
        
        function clearData() {
            if (confirm('确定清空所有数据吗？此操作不可恢复！')) {
                data = {};
                saveData();
                updateUI();
            }
        }
        
        function calcNumStats(num) {
            const periods = Object.keys(data).map(Number).sort((a, b) => a - b);
            const stats = {};
            
            for (let gap = 1; gap <= 5; gap++) {
                let total = 0;
                let hit = 0;
                
                for (let i = 0; i < periods.length - gap - 2; i++) {
                    let allMissing = true;
                    for (let j = 1; j <= gap; j++) {
                        if (data[periods[i + j]].includes(num)) {
                            allMissing = false;
                            break;
                        }
                    }
                    
                    if (!allMissing) continue;
                    if (i >= 0 && !data[periods[i]].includes(num)) continue;
                    
                    let appeared = false;
                    for (let k = 1; k <= 3; k++) {
                        const idx = i + gap + k;
                        if (idx < periods.length && data[periods[idx]].includes(num)) {
                            appeared = true;
                            break;
                        }
                    }
                    
                    total++;
                    if (appeared) hit++;
                }
                
                if (total > 0) {
                    stats[gap] = {hit, total, rate: hit / total};
                }
            }
            
            return stats;
        }
        
        function updatePeriodTable() {
            const periods = Object.keys(data).map(Number).sort((a, b) => a - b);
            const range = document.getElementById('recordRange').value;
            
            let displayPeriods = periods;
            if (range !== 'all') {
                const count = parseInt(range);
                displayPeriods = periods.slice(-count);
            }
            
            const periodTable = document.getElementById('periodTable');
            periodTable.innerHTML = displayPeriods.reverse().map(p => `
                <tr>
                    <td>第${p}期</td>
                    <td>${data[p].join(', ')}</td>
                    <td><button class="btn btn-danger" onclick="deletePeriod(${p})">删除</button></td>
                </tr>
            `).join('');
        }

        function updateUI() {
            const periods = Object.keys(data).map(Number).sort((a, b) => a - b);
            
            document.getElementById('totalPeriods').textContent = periods.length;
            
            if (periods.length > 0) {
                const latest = periods[periods.length - 1];
                document.getElementById('latestPeriod').textContent = latest;
                document.getElementById('latestNumbers').textContent = data[latest].join(',');
            }
            
            updatePeriodTable();
            
            const statsTable = document.getElementById('statsTable');
            let statsHTML = '';
            
            for (let num = 0; num <= 9; num++) {
                const stats = calcNumStats(num);
                let bestGap = null;
                let bestRate = 0;
                let bestHit = 0;
                let bestTotal = 0;
                
                for (let gap in stats) {
                    if (stats[gap].total >= 5 && stats[gap].rate > bestRate) {
                        bestGap = gap;
                        bestRate = stats[gap].rate;
                        bestHit = stats[gap].hit;
                        bestTotal = stats[gap].total;
                    }
                }
                
                if (!bestGap) {
                    for (let gap in stats) {
                        if (stats[gap].total >= 3 && stats[gap].rate > bestRate) {
                            bestGap = gap;
                            bestRate = stats[gap].rate;
                            bestHit = stats[gap].hit;
                            bestTotal = stats[gap].total;
                        }
                    }
                }
                
                if (!bestGap && Object.keys(stats).length > 0) {
                    bestGap = Math.min(...Object.keys(stats).map(Number));
                    bestRate = stats[bestGap].rate;
                    bestHit = stats[bestGap].hit;
                    bestTotal = stats[bestGap].total;
                }
                
                let desc = '';
                if (bestRate >= 0.98) desc = '完美触发';
                else if (bestRate >= 0.95) desc = '非常稳定';
                else if (bestRate >= 0.90) desc = '稳定可靠';
                else desc = '需要等待';
                
                if (num === 6 && bestRate >= 0.95) desc = '最稳定';
                if (num === 7 && bestRate >= 0.95) desc = '最强反弹';
                
                statsHTML += `
                    <tr>
                        <td><strong>${num}</strong></td>
                        <td>缺席 ≥ ${bestGap || 2}期</td>
                        <td><span class="badge ${bestRate >= 0.95 ? 'badge-success' : bestRate >= 0.90 ? 'badge-warning' : 'badge-danger'}">${(bestRate * 100).toFixed(1)}%</span></td>
                        <td>${bestHit}/${bestTotal}</td>
                        <td>${desc}</td>
                    </tr>
                `;
            }
            
            statsTable.innerHTML = statsHTML;
        }

        async function loadLatestData() {
            try {
                const response = await fetch('lottery_data.json?t=' + Date.now());
                const json = await response.json();
                if (json.data) {
                    data = json.data;
                    localStorage.setItem('lotteryData', JSON.stringify(data));
                    console.log('✅ 已从服务器加载最新数据，共 ' + Object.keys(data).length + ' 期');
                    updateUI();
                }
            } catch (e) {
                console.log('⚠️ 无法加载服务器数据，使用本地数据');
            }
        }
        
        // 启动时加载最新数据
        loadLatestData();
        
        // 初始化
        updateUI();
    </script>
</body>
</html>
