name: 自动同步数据

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成数据
        run: python sync.py

      - name: 有变化则提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data.js; then
            echo "data.js 无变化，跳过提交"
          else
            git add data.js
            git commit -m "自动同步数据到最新期"
            git push
          fi
