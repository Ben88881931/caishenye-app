.wrap{overflow:auto;max-height:calc(100vh - 120px)}
table{border-collapse:collapse;width:max-content;min-width:100%}

td{width:24px;height:26px;min-width:24px}
td.numcol{padding:0}
td.hit{background:transparent}

td.zfirst{border-left:2px solid #9ca3af!important}

td.zodcell{width:22px;height:26px;min-width:22px;font-size:12px;font-weight:bold;color:#fbbf24;background:#232738}
thead th.znth{width:22px;min-width:22px}
.ball{display:block;width:20px;height:20px;line-height:20px;border-radius:5px;font-size:11px;font-weight:bold;color:#fff;text-align:center;margin:0 auto}
.c0{background:linear-gradient(135deg,#ef4444,#b91c1c)}
.c1{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.c2{background:linear-gradient(135deg,#22c55e,#15803d)}
.foot{text-align:center;font-size:11px;color:#6b7280;margin-top:10px}

      if(arr[i].nums[j]===1) last=arr[i].zods[j];
    }
  }
  if(last) return last;
  if(arr.length){return arr[arr.length-1].zods[0];}
  return '马';
}
function zodiacOf(num, tai){
  var idx=ZODS.indexOf(tai);
  return ZODS[((idx-(num-1))%12+12)%12];
}
// 该年生肖→号码列表（已按升序）
function numsOfZodiac(y){
  var tai=taishuOfYear(y);
  var m={};
  ZODS.forEach(function(z){m[z]=[];});
  for(var n=1;n<=49;n++){ m[zodiacOf(n,tai)].push(n); }
  return m;
}

function renderYear(y){
  var arr=D.filter(function(r){return r.y===y;});
  document.getElementById('years').querySelectorAll('button').forEach(function(b){b.className=(parseInt(b.dataset.y)===y)?'on':'';});
  var nmap=numsOfZodiac(y);

  // 表头：第一行生肖名(colspan=号码数+1)，第二行号码（末尾加1空列给生肖字）
  var h='<thead><tr><th class="period" rowspan="2">期</th>';
  for(var zi=0;zi<12;zi++){
    var z=ZODS[zi];
    var ns=nmap[z];
    h+='<th colspan="'+(ns.length+1)+'"><div class="zodname">'+z+'</div></th>';
  }
  h+='</tr><tr>';
  for(var zi2=0;zi2<12;zi2++){
    var z2=ZODS[zi2];
    var ns2=nmap[z2];
    // 生肖字格对应表头（空）
    h+='<th class="znth"></th>';
    for(var k=0;k<ns2.length;k++){
      var n=ns2[k];
      h+='<th><div class="numhdr">'+(n<10?'0'+n:n)+'</div></th>';
    }
  }
  h+='</tr></thead><tbody>';

  // 每期一行：每个生肖组 = 1个生肖字格 + N个号码格
  for(var i=arr.length-1;i>=0;i--){
    var r=arr[i];
    // 建立 号码->颜色，以及当期开出的生肖集合
    var numColor={};
    var openedZod={};
    for(var j=0;j<7;j++){ numColor[r.nums[j]]=colorOf(r.nums[j]); openedZod[r.zods[j]]=true; }
    h+='<tr><td class="period">'+r.p+'</td>';
    for(var zi3=0;zi3<12;zi3++){
      var z3=ZODS[zi3];
      var ns3=nmap[z3];
      // 生肖字格：当期开出才写生肖中文，否则留空
      var ztxt=openedZod[z3]?z3:'';
      h+='<td class="zodcell">'+ztxt+'</td>';
      // 号码格
      for(var k2=0;k2<ns3.length;k2++){
        var n3=ns3[k2];
        var zf=(k2===0)?' zfirst':'';
        var cls='numcol'+zf;
        if(numColor[n3]!==undefined){
          h+='<td class="'+cls+' hit"><span class="ball c'+numColor[n3]+'">'+(n3<10?'0'+n3:n3)+'</span></td>';
        }else{
          h+='<td class="'+cls+'"></td>';
        }
      }
    }
    h+='</tr>';
  }
  h+='</tbody>';
  document.getElementById('tbl').innerHTML=h;
  document.getElementById('ft').textContent=y+'年 共'+arr.length+'期 | 每个号码对号入座';
}
function init(){
  var years={};D.forEach(function(r){years[r.y]=1;});
  var ys=Object.keys(years).sort(function(a,b){return b-a;});
  var bar='';ys.forEach(function(y){bar+='<button data-y="'+y+'">'+y+'年</button>';});
  document.getElementById('years').innerHTML=bar;
  document.getElementById('years').querySelectorAll('button').forEach(function(b){b.onclick=function(){renderYear(parseInt(b.dataset.y));};});
  renderYear(parseInt(ys[0]));
}
init();
</script>
