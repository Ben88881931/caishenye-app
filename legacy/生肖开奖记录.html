var ZODS=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
var RED=new Set([1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46]);
var BLUE=new Set([3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48]);
function colorOf(n){return RED.has(n)?0:(BLUE.has(n)?1:2);}
function renderYear(y){
  var arr=D.filter(function(r){return r.y===y;});
  document.getElementById('years').querySelectorAll('button').forEach(function(b){b.className=(parseInt(b.dataset.y)===y)?'on':'';});
  var cnt={};ZODS.forEach(function(z){cnt[z]=0;});
  arr.forEach(function(r){r.zods.forEach(function(z){cnt[z]++;});});
  var totalZC=arr.length*7;
  var zg='<h2>'+y+'年 生肖出现统计（'+totalZC+'个号码）</h2><div class="zgrid">';
  ZODS.forEach(function(z){var pct=(cnt[z]/totalZC*100).toFixed(1);zg+='<div class="zitem"><div class="zn">'+z+'</div><div class="zc">'+cnt[z]+'次 '+pct+'%</div></div>';});
  zg+='</div>';
  document.getElementById('zstat').innerHTML=zg;
  var h='<tr><th>期号</th><th>号码 / 生肖</th></tr>';
  for(var i=0;i<arr.length;i++){
    var r=arr[i],cells='';
    for(var j=0;j<7;j++){
      var n=r.nums[j],z=r.zods[j],c=colorOf(n);
      cells+='<span class="cell"><span class="ball c'+c+'">'+(n<10?'0'+n:n)+'</span><span class="zod">'+z+'</span></span>';
    }
    h+='<tr><td style="font-weight:bold;color:#fbbf24">'+r.p+'</td><td>'+cells+'</td></tr>';
  }
  document.getElementById('tbl').innerHTML=h;
  document.getElementById('ft').textContent=y+'年 共'+arr.length+'期';
}
function init(){
  var years={};D.forEach(function(r){years[r.y]=1;});
  var ys=Object.keys(years).sort(function(a,b){return b-a;});
  var bar='';ys.forEach(function(y){bar+='<button data-y="'+y+'">'+y+'年</button>';});
  document.getElementById('years').innerHTML=bar;
  document.getElementById('years').querySelectorAll('button').forEach(function(b){b.onclick=function(){renderYear(parseInt(b.dataset.y));};});
  renderYear(parseInt(ys[0]));
}

init();

window.addEventListener('load',function(){setTimeout(function(){var t=document.getElementById('tbl');if(t&&t.rows&&t.rows.length>1){var last=t.rows[t.rows.length-1];if(last.scrollIntoView){last.scrollIntoView({block:'end'});return;}}if(t&&t.scrollIntoView){t.scrollIntoView({block:'end'});}else{window.scrollTo(0,document.body.scrollHeight);}},300);});
