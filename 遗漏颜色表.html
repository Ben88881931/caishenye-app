<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>遗漏颜色表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2ff;color:#333;padding:12px;max-width:800px;margin:0 auto}
h1{text-align:center;font-size:18px;color:#6c5ce7;margin-bottom:14px}
.nav{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.nav a{text-decoration:none;padding:8px 16px;border-radius:8px;font-size:13px;background:#fff;border:1px solid #d5d5f0;color:#6c5ce7}
.nav a.on{background:#6c5ce7;border-color:#6c5ce7;color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:8px;overflow:hidden;border:1px solid #e8e4f0}
th,td{padding:2px 1px;text-align:center;border:1px solid #e8e4f0}
th{background:#f5f3ff;color:#888;font-size:11px;font-weight:500;position:sticky;top:0;z-index:10}
td{color:#222}
.num{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:4px;margin:0;font-size:13px;font-weight:bold;text-align:center}
.hit{background:#dc2626;color:#fff}
.m1{background:#3b82f6;color:#fff}
.m2{background:#22c55e;color:#fff}
.m3{background:#eab308;color:#7a5b00}
.cell{padding:0;border:0;vertical-align:middle}
.legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:11px;color:#888;margin-bottom:10px}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px}
.foot{text-align:center;font-size:11px;color:#ccc;margin-top:10px}
</style>
</head>
<body>
<h1>遗漏颜色表</h1>
<div class="nav">
  <a href="开奖历史记录.html">开奖记录</a>
  <a href="尾数分析器.html">尾数分析器</a>
  <a href="遗漏监控.html">遗漏监控</a>
  <a href="遗漏颜色表.html" class="on">遗漏颜色</a>
  
  
</div>
<div class="legend">
  <span><i style="background:#ef4444"></i>开出</span>
  <span><i style="background:#3b82f6"></i>遗漏1期</span>
  <span><i style="background:#22c55e"></i>遗漏2期</span>
  <span><i style="background:#eab308"></i>遗漏3期+</span>
</div>
<div style="overflow-x:auto;max-height:calc(100vh - 120px);overflow-y:auto"><table id="tbl"></table></div>
<div class="foot" id="ft"></div>
<div style="background:#fff;border:1px solid #e8e4f0;border-radius:8px;padding:12px;margin-top:12px">
  <div style="font-size:14px;font-weight:bold;color:#6c5ce7;margin-bottom:8px">🧭 遗漏规律预测</div>
  <div id="predBody" style="font-size:12px;color:#555;line-height:1.9"></div>
  <div style="font-size:10px;color:#bbb;margin-top:6px">反弹率=历史中"连遗N期后下一期开出"的概率</div>
</div>

<div style="background:#fff;border:1px solid #e8e4f0;border-radius:8px;padding:12px;margin-top:10px">
  <div style="font-size:14px;font-weight:bold;color:#6c5ce7;margin-bottom:8px">🧬 尾号性格表（单号独立规律）</div>
  <div style="overflow-x:auto"><table id="pTable" style="width:100%;border-collapse:collapse;font-size:11px;background:#fff"></table></div>
  <div style="font-size:10px;color:#bbb;margin-top:6px">反弹率=该尾号自己历史中"遗漏N期后下一期开出"的概率。🟢稳定 🟡中等 🔴风险</div>
</div>

<script>
var RAW={"1":"0111000111","2":"0111110110","3":"1010110101","4":"0010011101","5":"1001001101","6":"0101011000","7":"1100110010","8":"0100011001","9":"0010001111","10":"1101100111","11":"1110010110","12":"1101011000","13":"0100101101","14":"0111001010","15":"1101010010","16":"1010101010","17":"0111100010","18":"1111010001","19":"0010011101","20":"0110100101","21":"1011110100","22":"1000001111","23":"0100001111","24":"1001110010","25":"1100101101","26":"0011100101","27":"1100011011","28":"0011000111","29":"0101110110","30":"0101111100","31":"0100011111","32":"1101001101","33":"0111101010","34":"1001110011","35":"0110101101","36":"1100100111","37":"0011110001","38":"1010101001","39":"1100100011","40":"0100001111","41":"0010101110","42":"0110001111","43":"1011010001","44":"0000001111","45":"1111000110","46":"1011001001","47":"1011011101","48":"0010101011","49":"0111000011","50":"1001100100","51":"1110101010","52":"1001111010","53":"0111011110","54":"1110000111","55":"1100100011","56":"1000011111","57":"1101101001","58":"1101000010","59":"1011100011","60":"1100110101","61":"0010011111","62":"0010111001","63":"0110101110","64":"1011100010","65":"0011110110","66":"1010101110","67":"1100011001","68":"0111001011","69":"1001101010","70":"1101010100","71":"1100110010","72":"0110111010","73":"0101101101","74":"1110110001","75":"1111001101","76":"0111100100","77":"1010011101","78":"1011001110","79":"1001111001","80":"0111000111","81":"0100111100","82":"0101010100","83":"1101011010","84":"1110111100","85":"1001101101","86":"0010111000","87":"0110001101","88":"1010001110","89":"0110111001","90":"1010001111","91":"0010110110","92":"0010011110","93":"1001101110","94":"0001111110","95":"0100010011","96":"0001011100","97":"0100101011","98":"0011100111","99":"1010000110","100":"0011110010","101":"1010100011","102":"1011001101","103":"1101101001","104":"1101010011","105":"0110101111","106":"1110011010","107":"1101111001","108":"1000111010","109":"0001101111","110":"1001010001","111":"0101100010","112":"1000110101","113":"0010010101","114":"1100011000","115":"0100111111","116":"1011011010","117":"0011011101","118":"1010001111","119":"1110000010","120":"1001101110","121":"1100111010","122":"0111010010","123":"0011101101","124":"1010011101","125":"1100001111","126":"1101010001","127":"0001110111","128":"0010011100","129":"1100110100","130":"0100011001","131":"1110010100","132":"1100110001","133":"0101101110","134":"1010101101","135":"1000010111","136":"0110110110","137":"1010111101","138":"1010101011","139":"1100111010","140":"1011101000","141":"0011100110","142":"0101011010","143":"0011101010","144":"0111001101","145":"0011011110","146":"1110011001","147":"1101001011","148":"0101100110","149":"1000110110","150":"0110110001","151":"1110010101","152":"0100111100","153":"1101001010","154":"0111101010","155":"1101001100","156":"0111001100","157":"1101010100","158":"0111001010","159":"0010101111","160":"1110001011","161":"1010101011","162":"0111101100","163":"1101000111","164":"0111101010","165":"0111000101","166":"1100111010","167":"1101000101","168":"1101110100","169":"1010100110","170":"1001101110","171":"1110101010","172":"0010110110","173":"1001001001","174":"0101110010","175":"1000011111","176":"1110011010","177":"0110110001","178":"0110101110","179":"1100011001","180":"1100100101","181":"0000111101","182":"0101110001","183":"0011101101","184":"1100111000","185":"1010011011","186":"0111010111","187":"0111001110","188":"1100111011","189":"1011010110","190":"0000101111","191":"0001101001","192":"1100010110","193":"0110010001","194":"1110111000","195":"0001111001","196":"1101100101","197":"1000100011","198":"0110110110","199":"0010011111","200":"0011011001","201":"0110011011","202":"1101010100","203":"0111100100","204":"1110011100","205":"1111001111","206":"1001010101","207":"1101101101","208":"1001010111","209":"0110110011","210":"1010010111","211":"0111000111","212":"0011001101","213":"0110010001","214":"1101100111","215":"1101100011","216":"0110111110","217":"1110101100","218":"0011001110","219":"0111000111","220":"0010110111","221":"0100101010","222":"0000101111","223":"0101100011","224":"0000011011","225":"1100100111","226":"0101100111"};
var keys=Object.keys(RAW).sort(function(a,b){return parseInt(a)-parseInt(b);});

// 计算每个尾号每个遗漏周期的颜色
var missColor = {};
var missMark = {}; // 段尾数字
for(var d=0;d<10;d++){
  missColor[d] = {};
  missMark[d] = {};
  var lastOpen = -1;
  
  for(var i=0;i<keys.length;i++){
    var period = parseInt(keys[i]);
    if(RAW[keys[i]][d]==='1'){
      if(lastOpen >= 0){
        var cycleLen = period - lastOpen - 1;
        var cls = cycleLen>=3?'m3':cycleLen===2?'m2':'m1';
        for(var p=lastOpen+1;p<period;p++){
          missColor[d][p] = cls;
        }
        missMark[d][period-1] = cycleLen; // 段尾写遗漏期数
      }
      lastOpen = period;
    }
  }
  
  // 最后一次开出后的遗漏
  if(lastOpen >= 0){
    var latest = parseInt(keys[keys.length-1]);
    var cycleLen = latest - lastOpen;
    var cls = cycleLen>=3?'m3':cycleLen===2?'m2':'m1';
    for(var p=lastOpen+1;p<=latest;p++){
      missColor[d][p] = cls;
    }
    missMark[d][latest] = cycleLen; // 段尾写遗漏期数
  }
}

var h='<tr><th>期号</th><th>开奖尾号</th><th>个数</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th></tr>';
for(var i=0;i<keys.length;i++){
  var k=keys[i],arr=[],row=RAW[k];
  for(var j=0;j<10;j++)if(row[j]==='1')arr.push(j);
  h+='<tr><td style="font-weight:bold">'+k+'</td><td>'+arr.join(' ')+'</td><td>'+arr.length+'</td>';
  for(var j=0;j<10;j++){
    if(row[j]==='1'){
      h+='<td class="cell"><span class="num hit">'+j+'</span></td>';
    }else{
      var cls = missColor[j][parseInt(k)] || 'm1';
      var mk = missMark[j][parseInt(k)];
      var CN=['','一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十'];
      var markTxt = (mk!==undefined)?(CN[mk]||mk):'';
      h+='<td class="cell"><span class="num '+cls+'">'+markTxt+'</span></td>';
    }
  }
  h+='</tr>';
}
document.getElementById('tbl').innerHTML=h;
document.getElementById('ft').textContent='数据: 第'+keys[0]+'-'+keys[keys.length-1]+'期 | 共'+keys.length+'期';


// ===== 遗漏规律预测 =====
(function(){
    var R={};
  // 动态计算反弹率：统计每个尾号"遗漏N期后下一期开出"的历史概率
  var missStat={};
  for(var dd=0;dd<10;dd++){
    var lo=-1;
    for(var ii=0;ii<keys.length;ii++){
      if(RAW[keys[ii]][dd]==='1'){
        if(lo>=0){
          var miss=parseInt(keys[ii])-lo-1;
          for(var ml=1;ml<=miss;ml++){
            if(!missStat[ml])missStat[ml]={t:0,h:0};
            missStat[ml].t++;
            if(ml===miss)missStat[ml].h++;
          }
        }
        lo=parseInt(keys[ii]);
      }
    }
  }
  for(var ml in missStat){R[ml]=(missStat[ml].h/missStat[ml].t*100).toFixed(1);}
  var colorName={
    red:'已开出',
    m1:'遗漏1期',
    m2:'遗漏2期',
    m3:'遗漏3期+'
  };
  // 计算每个尾号当前遗漏
  var list=[];
  for(var d=0;d<10;d++){
    var consec=0;
    for(var i=keys.length-1;i>=0;i--){
      if(RAW[keys[i]][d]==='0')consec++;
      else break;
    }
    var bounce=(consec>=1&&R[consec])?R[consec]:null;
    var color=consec===0?'red':consec===1?'m1':consec===2?'m2':'m3';
    list.push({d:d,consec:consec,color:color,bounce:bounce});
  }
  // 排序：遗漏越久越靠前
  list.sort(function(a,b){return b.consec-a.consec;});
  
  var html='';
  for(var i=0;i<list.length;i++){
    var c=list[i];
    var colorDot=c.color==='red'?'#ef4444':c.color==='m1'?'#3b82f6':c.color==='m2'?'#22c55e':'#eab308';
    var status=c.consec===0?'已开出(红)':'遗漏'+c.consec+'期';
    var bounceTxt=(c.consec===0)?'—':(c.bounce?c.bounce+'%':'>历史'+(c.consec)+'期');
    var hot=c.consec>=5?' 🔥':'';
    html+='<span style="display:inline-block;margin:2px 4px;padding:2px 8px;border-radius:6px;background:#f7f6ff">'
      +'<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+colorDot+';margin-right:4px"></span>'
      +'<b>尾'+c.d+'</b> '+status+' · 反弹率 '+bounceTxt+hot
      +'</span>';
  }
  // 反弹候选
  var cand=list.filter(function(c){return c.consec>=3;});
  var candTxt='';
  if(cand.length>0){
    candTxt='<div style="margin-top:8px;color:#dc2626;font-weight:bold">反弹候选: '+cand.map(function(c){return '尾'+c.d+'('+c.consec+'期'+(c.bounce?',反弹'+c.bounce+'%':'')+')';}).join('、')+'</div>';
  }else{
    candTxt='<div style="margin-top:8px;color:#888">当前无遗漏≥3期的尾号</div>';
  }
  document.getElementById('predBody').innerHTML=html+candTxt;
})();


// ===== 尾号性格表（单号独立规律）=====
(function(){
  function oscState(d){
    var N=keys.length;
    var consec=0;
    for(var i=N-1;i>=0;i--){if(RAW[keys[i]][d]==='0')consec++;else break;}
    // 单号反弹率
    var b={};
    var lo=-1;
    for(var i=0;i<N;i++){
      if(RAW[keys[i]][d]==='1'){
        if(lo>=0){
          var miss=parseInt(keys[i])-lo-1;
          for(var x=1;x<=miss;x++){
            if(!b[x])b[x]={t:0,h:0};
            b[x].t++;
            if(x===miss)b[x].h++;
          }
        }
        lo=parseInt(keys[i]);
      }
    }
    var r2 = b[2] ? (b[2].h/b[2].t*100) : 50;
    var slip = 100 - r2; // 遗2期滑向大遗漏的概率
    var slipTag = slip>=55 ? '🔴易滑' : slip>=45 ? '🟡中等' : '🟢稳定';
    if(consec===0) return {t:'🟢刚出',c:'#22c55e',slip:slip,slipTag:slipTag};
    if(consec===1) return {t:slipTag+'·震1',c:(slip>=55?'#ef4444':slip>=45?'#eab308':'#22c55e'),slip:slip,slipTag:slipTag};
    if(consec===2) return {t:slipTag+'·震2临界',c:(slip>=55?'#ef4444':slip>=45?'#eab308':'#22c55e'),slip:slip,slipTag:slipTag};
    return {t:'🔴大遗漏',c:'#ef4444',slip:slip,slipTag:slipTag};
  };
  // 单号反弹率：每个尾号自己的"遗漏X期→下期开出率"
  var pBounce={};
  for(var d=0;d<10;d++){
    pBounce[d]={};
    var lo=-1;
    for(var i=0;i<keys.length;i++){
      if(RAW[keys[i]][d]==='1'){
        if(lo>=0){
          var miss=parseInt(keys[i])-lo-1;
          for(var x=1;x<=miss;x++){
            if(!pBounce[d][x])pBounce[d][x]={t:0,h:0};
            pBounce[d][x].t++;
            if(x===miss)pBounce[d][x].h++;
          }
        }
        lo=parseInt(keys[i]);
      }
    }
  }
  // 当前各尾号遗漏
  function curMiss(dd){
    var c=0;
    for(var i=keys.length-1;i>=0;i--){if(RAW[keys[i]][dd]==='0')c++;else break;}
    return c;
  }
  // 稳定度评级：根据遗1-3期反弹率的平均
  function grade(dd){
    var bb=pBounce[dd];
    var arr=[];
    for(var x=1;x<=3;x++){
      var s=bb[x];
      if(s&&s.t>=3)arr.push(s.h/s.t*100);
    }
    if(arr.length===0)return {g:'—',c:'#999'};
    var avg=arr.reduce(function(a,b){return a+b;},0)/arr.length;
    if(avg>=62)return {g:'🟢稳',c:'#22c55e'};
    if(avg>=52)return {g:'🟡中',c:'#eab308'};
    return {g:'🔴险',c:'#ef4444'};
  }
  var h='<tr><th>尾号</th><th>遗1</th><th>遗2</th><th>遗3</th><th>遗4</th><th>遗5+</th><th>性格</th><th>当前遗漏</th><th>震荡预警</th></tr>';
  for(var d=0;d<10;d++){
    var bb=pBounce[d];
    function cell(x){
      var s=bb[x];
      if(!s)return '<td>-</td>';
      if(s.t<3)return '<td style="color:#bbb">'+(s.h/s.t*100).toFixed(0)+'%*</td>';
      var r=s.h/s.t*100;
      var c=r>=62?'#22c55e':r>=52?'#eab308':'#ef4444';
      return '<td style="color:'+c+';font-weight:bold">'+r.toFixed(0)+'%</td>';
    }
    var grd=grade(d);
    var cm=curMiss(d);
    var cmTag;
    if(cm===0)cmTag='<span style="color:#22c55e">已出</span>';
    else{
      var s5=bb[cm];
      var curRate=s5&&s5.t>=2?(s5.h/s5.t*100).toFixed(0)+'%':'-';
      var warn=cm>=4?'⚠️':'';
      cmTag=cm+'期'+warn+'<br><span style="color:#888;font-size:10px">反弹'+curRate+'</span>';
    }
    h+='<tr><td style="font-weight:bold">'+d+'</td>'+cell(1)+cell(2)+cell(3)+cell(4)+cell(5)+'<td style="font-weight:bold;color:'+grd.c+'">'+grd.g+'</td><td style="font-size:11px">'+cmTag+'</td><td style="font-weight:bold">'+oscState(d).t+'</td></tr>';
  }
  document.getElementById('pTable').innerHTML=h;
})();

setTimeout(function(){ var t=document.getElementById('tbl'); if(t){ window.scrollTo(0, t.getBoundingClientRect().bottom + window.scrollY - 10); } else { window.scrollTo(0, document.body.scrollHeight); } }, 150);

window.addEventListener('load',function(){setTimeout(function(){var t=document.getElementById('tbl');if(t&&t.rows&&t.rows.length>1){var last=t.rows[t.rows.length-1];if(last.scrollIntoView){last.scrollIntoView({block:'end'});return;}}if(t&&t.scrollIntoView){t.scrollIntoView({block:'end'});}else{window.scrollTo(0,document.body.scrollHeight);}},300);});
</script>
</body>
