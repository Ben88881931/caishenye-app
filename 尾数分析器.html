<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2ff;color:#333;padding:12px;max-width:1400px;margin:0 auto}
h1{text-align:center;font-size:18px;color:#6c5ce7;margin-bottom:6px}
.sub{text-align:center;font-size:11px;color:#aaa;margin-bottom:10px}
.bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.bar select{padding:6px 10px;border:1px solid #d5d5f0;border-radius:6px;font-size:13px;background:#fff;color:#444}

.bar button.on{background:#6c5ce7;border-color:#6c5ce7;color:#fff;font-weight:bold}
.nums{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.nums button{width:34px;height:34px;border:1px solid #d5d5f0;border-radius:6px;font-size:14px;font-weight:bold;cursor:pointer;background:#fff;color:#555}
.nums button.on{background:#6c5ce7;border-color:#6c5ce7;color:#fff}
.box{overflow-x:auto;margin-bottom:12px;background:#fff;border:1px solid #e8e4f0;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;text-align:center;white-space:nowrap;border:1px solid #e8e4f0}
th{background:#f5f3ff;color:#888;font-size:11px;font-weight:500}
td.fix{font-size:16px;font-weight:700;color:#6c5ce7;background:#f5f3ff}
td{color:#222}
.hot{background:#86efac}.warm{background:#93c5fd}.norm{background:#cbd5e1}
.cool{background:#fde68a}.cold{background:#fca5a5}.ice{background:#fb7185}
.big{font-weight:700;font-size:16px}
.arr{font-size:11px}
.tip{border:1px solid #e8e4f0;padding:10px 12px;margin-bottom:10px;background:#fff;border-radius:8px;font-size:14px;line-height:1.8}
.tip b{color:#6c5ce7}
.legend{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:11px;margin-bottom:8px;color:#888}
.legend span{display:flex;align-items:center;gap:3px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px}
.foot{text-align:center;font-size:11px;color:#ccc;margin-top:6px}
.dim{color:#999;font-size:10px}
.pred{font-size:10px;color:#6c5ce7;margin-top:2px}
.nav{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.nav a{text-decoration:none;padding:6px 14px;border-radius:8px;font-size:13px;background:#fff;border:1px solid #d5d5f0;color:#6c5ce7}
.nav a.on{background:#6c5ce7;border-color:#6c5ce7;color:#fff}
</style>

function open(d,p){return H[p]&&H[p].indexOf(d)>=0;}

function getPred(d,segIdx,w){
    var wdata = ALLDATA[String(w)];
    if(!wdata) return null;
    var preds = wdata.preds[String(d)];
    if(preds && segIdx>=2 && segIdx-2<preds.length){
        return preds[segIdx-2];
    }
    return null;
}

}

}

    else if(r[2]>r[1]&&r[1]>r[0]&&cur<60) pd='▲ 升温，可能变暖';

    else if(r[2]<r[1]&&r[1]<r[0]&&cur<60) pd='▼ 降温，可能变冷';
