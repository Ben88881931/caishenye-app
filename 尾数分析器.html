<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2ff;color:#333;padding:2px 0;margin:0 auto}
h1{text-align:center;font-size:16px;color:#6c5ce7;margin-bottom:4px}
.sub{text-align:center;font-size:10px;color:#aaa;margin-bottom:6px}
.bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.bar select{padding:4px 8px;border:1px solid #d5d5f0;border-radius:6px;font-size:11px;background:#fff;color:#444}
.bar button{padding:4px 10px;border:1px solid #d5d5f0;border-radius:6px;font-size:11px;cursor:pointer;background:#fff;color:#444}
.bar button.on{background:#6c5ce7;border-color:#6c5ce7;color:#fff;font-weight:bold}
.nums{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.nums button{width:28px;height:28px;border:1px solid #d5d5f0;border-radius:6px;font-size:12px;font-weight:bold;cursor:pointer;background:#fff;color:#555}
.nums button.on{background:#6c5ce7;border-color:#6c5ce7;color:#fff}
.box{overflow-x:auto;max-height:calc(100vh - 150px);-webkit-overflow-scrolling:touch;margin:0 auto}
table{table-layout:fixed;width:auto;margin:0 auto;border-collapse:collapse;font-size:9px}
th,td{padding:1px 0;text-align:center;border:1px solid #e8e4f0;font-size:9px;line-height:1.2;width:9%;height:32px;max-height:32px;overflow:hidden}
th{background:#f5f3ff;color:#333;font-size:9px;font-weight:700;position:sticky;top:0;z-index:10;height:24px;max-height:24px}
td.fix{font-size:9px;font-weight:600;color:#6c5ce7;background:#f5f3ff;position:sticky;left:0;z-index:5;box-shadow:2px 0 4px rgba(0,0,0,0.08);width:22px;min-width:22px;max-width:22px;writing-mode:vertical-lr;text-orientation:upright}
td{color:#222}
.hot{background:#22c55e}.warm{background:#3b82f6}.norm{background:#94a3b8}
.cool{background:#eab308}.cold{background:#ef4444}.ice{background:#ec4899}
.big{font-weight:700;font-size:10px}
.lbl{font-weight:800;font-size:10px;color:#000}
.arr{font-size:14px;font-weight:bold}
.tip{border:1px solid #e8e4f0;padding:10px 12px;margin-bottom:10px;background:#fff;border-radius:8px;font-size:14px;line-height:1.8;position:sticky;bottom:0;z-index:8}
.tip b{color:#6c5ce7}
.legend{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:11px;margin:0;padding:8px;color:#888;background:rgba(240,242,255,0.95);z-index:100;border-bottom:1px solid #e8e4f0;backdrop-filter:blur(4px)}
.legend span{display:flex;align-items:center;gap:3px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px}
.foot{text-align:center;font-size:11px;color:#ccc;margin-top:6px}
.dim{color:#999;font-size:10px}
.pred{font-size:10px;color:#1a1a2e;font-weight:700;line-height:1.2;text-shadow:0 0 1px rgba(255,255,255,0.5)}
.nav{display:flex;gap:4px;justify-content:center;margin-bottom:6px;flex-wrap:wrap}
.nav a{text-decoration:none;padding:4px 10px;border-radius:6px;font-size:11px;background:#fff;border:1px solid #d5d5f0;color:#6c5ce7}
.nav a.on{background:#6c5ce7;border-color:#6c5ce7;color:#fff}
/* 竖版卡片布局 */
.v-cards{display:none;flex-direction:column;gap:12px;padding-bottom:20px}
.v-card{background:#fff;border:1px solid #e8e4f0;border-radius:10px;overflow:hidden}
.v-card-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#f5f3ff;border-bottom:1px solid #e8e4f0}
.v-card-head .digit{font-size:18px;font-weight:700;color:#6c5ce7}
.v-card-head .trend{font-size:12px;font-weight:600}
.v-card-head .trend.up{color:#16a34a}
.v-card-head .trend.down{color:#dc2626}
.v-card-head .trend.flat{color:#aaa}
.v-card-stats{display:flex;gap:0;padding:0;border-bottom:1px solid #f0ecf8}
.v-card-stats .stat{flex:1;text-align:center;padding:8px 4px;border-right:1px solid #f0ecf8}
.v-card-stats .stat:last-child{border-right:none}
.v-card-stats .stat .val{font-size:14px;font-weight:700;color:#333}
.v-card-stats .stat .lbl{font-size:10px;color:#999;margin-top:2px}
.v-card-segs{padding:8px 12px}
.v-card-segs .seg-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f8f6ff}
.v-card-segs .seg-row:last-child{border-bottom:none}
.v-card-segs .seg-label{font-size:11px;color:#888;width:60px;flex-shrink:0}
.v-card-segs .seg-bar{flex:1;height:22px;border-radius:4px;position:relative;display:flex;align-items:center;padding:0 6px}
.v-card-segs .seg-bar .seg-text{font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.3);white-space:nowrap}
.v-card-segs .seg-arrow{width:20px;text-align:center;font-size:11px;flex-shrink:0}
.v-card-pred{padding:8px 12px;background:#faf8ff;border-top:1px solid #f0ecf8;font-size:12px;color:#6c5ce7;font-weight:500}
.v-card-warn{padding:6px 12px;background:#fef3c7;border-top:1px solid #fde68a;font-size:11px;color:#92400e;font-weight:500}

</style>
</head>

function open(d,p){return H[p]&&H[p].indexOf(d)>=0;}
function cls(r){if(r>=70)return'hot';if(r>=60)return'warm';if(r>=50)return'norm';if(r>=40)return'cool';if(r>=30)return'cold';return'ice';}
function label(r){if(r>=70)return'热';if(r>=60)return'暖';if(r>=50)return'平';if(r>=40)return'凉';if(r>=30)return'冷';return'冰';}
function segs(d,w){var s=[];for(var st=1;st<=N;st+=w){var en=Math.min(st+w-1,N),tot=en-st+1,c=0;for(var p=st;p<=en;p++)if(open(d,p))c++;s.push({st:st,en:en,tot:tot,w:w,cnt:c,rate:w?(c/w*100):0,full:tot===w});}return s;}
function f1(v,d){return v.toFixed(d);}
function getPred(d,segIdx,w){
    var wdata = ALLDATA[String(w)];
    if(!wdata) return null;
    var preds = wdata.preds[String(d)];
    if(preds && segIdx>=2 && segIdx-2<preds.length){
        var p=preds[segIdx-2];
        // 格式: "凉->热->暖 67%" 或 "凉->暖 75%"
        var m=p.match(/(\d+)%/);
        if(!m) return null;
        var prob=parseInt(m[1]);
        if(prob<40) return null;  // 低于40%不显示
        // 只保留最后箭头后的预测+概率
        var parts=p.split('->');
        return parts[parts.length-1]+' '+prob+'%';
    }
    return null;
}
