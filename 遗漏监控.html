    }

        seen2[allRecs[i].digit]=true;
        recentList.push(allRecs[i]);
    }
}

for(var i=0;i<recentList.length;i++){

}

    var recs=md.records;
    var recStr='';
    for(var i=0;i<recs.length;i++){
