body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2ff;color:#333;padding:12px;max-width:800px;margin:0 auto}
h1{text-align:center;font-size:18px;color:#6c5ce7;margin-bottom:6px}
.sub{text-align:center;font-size:11px;color:#aaa;margin-bottom:14px}
.card{border:1px solid #e8e4f0;background:#fff;border-radius:10px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;color:#6c5ce7;margin-bottom:10px}
.list{list-style:none}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
.list li:last-child{border-bottom:none}
.num{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;background:#fca5a5;color:#fff;flex-shrink:0}
.num.done{background:#cbd5e1;color:#666}
.detail{flex:1;line-height:1.6}
.detail .miss{font-weight:bold;color:#dc2626}
.detail .ok{font-weight:bold;color:#16a34a}
.detail .dim{color:#999;font-size:12px}
.bar{display:flex;gap:4px;margin-top:4px}
.cell{width:14px;height:14px;border-radius:3px;background:#e5e7eb}
.cell.hit{background:#86efac}
.cell.miss{background:#fca5a5}
.foot{text-align:center;font-size:11px;color:#ccc;margin-top:10px}
</style>
</head>
