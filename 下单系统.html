<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>接金蛋 - 下单系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2ff;color:#333;padding:12px;max-width:800px;margin:0 auto}
h1{text-align:center;font-size:18px;color:#6c5ce7;margin-bottom:14px}
.nav{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.nav a{text-decoration:none;padding:6px 14px;border-radius:8px;font-size:13px;background:#fff;border:1px solid #d5d5f0;color:#6c5ce7}
.nav a.on{background:#6c5ce7;border-color:#6c5ce7;color:#fff}
.card{background:#fff;border:1px solid #e8e4f0;border-radius:8px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;color:#6c5ce7;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #e8e4f0}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.row label{font-size:13px;color:#666;min-width:70px}
.row input{padding:6px 10px;border:1px solid #d5d5f0;border-radius:6px;font-size:14px;width:80px}
.row input:focus{outline:none;border-color:#6c5ce7}
.row span{font-size:12px;color:#999}
.formula{background:#f5f3ff;border:1px solid #e8e4f0;border-radius:6px;padding:8px 12px;font-size:13px;color:#6c5ce7;margin-top:6px}
.num-btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.num-btn{width:36px;height:36px;border:2px solid #d5d5f0;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;background:#fff;color:#555;display:flex;align-items:center;justify-content:center}
.num-btn.sel{background:#6c5ce7;border-color:#6c5ce7;color:#fff}
.btn{padding:8px 16px;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-weight:bold}
.btn-p{background:#6c5ce7;color:#fff}
.btn-p:hover{background:#5a4bd6}
.btn-d{background:#fee2e2;color:#dc2626}
.btn-d:hover{background:#fecaca}
.btn-s{background:#dcfce7;color:#16a34a}
.btn-s:hover{background:#bbf7d0}
.btn-sm{padding:4px 8px;font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{padding:6px 8px;text-align:center;border-bottom:1px solid #e8e4f0}
th{background:#f5f3ff;color:#888;font-size:11px;font-weight:500}
td{color:#333}
.st-p{color:#f59e0b;font-weight:bold}
.st-h{color:#16a34a;font-weight:bold}
.st-m{color:#dc2626;font-weight:bold}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:#f5f3ff;padding:10px;border-radius:6px;text-align:center}
.stat .lb{font-size:11px;color:#888}
.stat .vl{font-size:18px;font-weight:bold;color:#6c5ce7}
.stat .vl.green{color:#16a34a}
.stat .vl.red{color:#dc2626}
.order-card{border:1px solid #e8e4f0;border-radius:8px;padding:12px;margin-bottom:10px}
.order-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.order-head .nums{font-size:16px;font-weight:bold;color:#6c5ce7}
.order-head .info{font-size:12px;color:#888}
.empty{text-align:center;color:#ccc;padding:20px;font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab-btn{flex:1;padding:10px;border:1px solid #d5d5f0;border-radius:8px;font-size:13px;cursor:pointer;background:#fff;color:#6c5ce7;text-align:center}
.tab-btn.on{background:#6c5ce7;border-color:#6c5ce7;color:#fff}
@media(max-width:500px){
.stats{grid-template-columns:repeat(2,1fr)}
.num-btn{width:32px;height:32px;font-size:14px}
}
</style>
</head>
<body>
<h1>接金蛋 - 下单系统</h1>
<div class="nav">
  <a href="index.html">首页</a>
  <a href="尾数分析器.html">尾数分析器</a>
  <a href="开奖历史记录.html">开奖记录</a>
  <a href="遗漏监控.html">遗漏监控</a>
  <a href="遗漏颜色表.html">遗漏颜色</a>
  <a href="下单系统.html" class="on">下单</a>
</div>

<div class="tabs">
  <button class="tab-btn on" onclick="switchTab('order')">下单</button>
  <button class="tab-btn" onclick="switchTab('record')">开奖记录</button>
</div>

<div id="orderPage">
  <div class="card">
    <h2>投注设置</h2>
    <div class="row">
      <label>基础金额</label>
      <input type="number" id="base" value="1000" min="1">
      <span>元</span>
    </div>
    <div class="row">
      <label>第1期</label>
      <input type="number" id="m1" value="1" min="0.1" step="0.1">
      <span>倍</span>
      <label style="margin-left:12px">第2期</label>
      <input type="number" id="m2" value="2.25" min="0.1" step="0.1">
      <span>倍</span>
    </div>
    <div class="row">
      <label>第3期</label>
      <input type="number" id="m3" value="30" min="0.1" step="0.1">
      <span>倍</span>
      <label style="margin-left:12px">回报率</label>
      <input type="number" id="ret" value="1.8" min="1" step="0.1">
      <span>倍</span>
    </div>
    <div class="formula" id="formula"></div>
  </div>

  <div class="card">
    <h2>新建下单</h2>
    <div class="row"><label>选择号码</label></div>
    <div class="num-btns" id="numBtns"></div>
    <div class="row">
      <label>起始期数</label>
      <input type="number" id="startP" placeholder="自动填充">
    </div>
    <button class="btn btn-p" onclick="createOrder()">创建下单</button>
  </div>

  <div class="card">
    <h2>当前下单</h2>
    <div id="orderList"></div>
  </div>

  <div class="card">
    <h2>历史统计</h2>
    <div class="stats" id="stats"></div>
    <div id="historyList"></div>
  </div>
</div>

<div id="recordPage" style="display:none">
  <div class="card">
    <h2>开奖记录</h2>
    <div id="recList"></div>
  </div>
</div>

<script>
let orders = JSON.parse(localStorage.getItem('orders') || '[]');
let history = JSON.parse(localStorage.getItem('orderHist') || '[]');
let records = [];
let selNums = new Set();

function loadRecords() {
  fetch('lottery_data.json')
    .then(r => r.json())
    .then(data => {
      records = [];
      Object.keys(data).sort((a, b) => parseInt(b) - parseInt(a)).forEach(k => {
        const nums = [];
        for (let i = 0; i < 10; i++) {
          if (data[k][i] === '1') nums.push(i);
        }
        records.push({ period: parseInt(k), nums: nums });
      });
      renderRecords();
      autoFillStartP();
    })
    .catch(e => console.error('加载数据失败', e));
}

function initNumBtns() {
  const c = document.getElementById('numBtns');
  let h = '';
  for (let i = 0; i < 10; i++) {
    h += '<button class="num-btn" id="n' + i + '" onclick="toggleNum(' + i + ')">' + i + '</button>';
  }
  c.innerHTML = h;
}

function toggleNum(n) {
  const btn = document.getElementById('n' + n);
  if (selNums.has(n)) { selNums.delete(n); btn.classList.remove('sel'); }
  else { selNums.add(n); btn.classList.add('sel'); }
}

function switchTab(tab) {
  document.getElementById('orderPage').style.display = tab === 'order' ? 'block' : 'none';
  document.getElementById('recordPage').style.display = tab === 'record' ? 'block' : 'none';
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('on', (i === 0 && tab === 'order') || (i === 1 && tab === 'record'));
  });
  if (tab === 'record') renderRecords();
}

function updateFormula() {
  const base = parseFloat(document.getElementById('base').value) || 0;
  const m1 = parseFloat(document.getElementById('m1').value) || 0;
  const m2 = parseFloat(document.getElementById('m2').value) || 0;
  const m3 = parseFloat(document.getElementById('m3').value) || 0;
  const ret = parseFloat(document.getElementById('ret').value) || 0;
  document.getElementById('formula').innerHTML =
    '第1期：<b>' + (base * m1) + '元</b> | 第2期：<b>' + (base * m2) + '元</b> | 第3期：<b>' + (base * m3) + '元</b> | 回报率：<b>' + ret + '倍</b>';
}

function autoFillStartP() {
  const el = document.getElementById('startP');
  if (!el.value && records.length > 0) {
    const maxP = Math.max(...records.map(r => r.period));
    el.value = maxP + 1;
  }
}

function createOrder() {
  if (selNums.size === 0) { alert('请选择号码'); return; }
  const startP = parseInt(document.getElementById('startP').value);
  if (!startP) { alert('请输入起始期数'); return; }
  const base = parseFloat(document.getElementById('base').value);
  const m1 = parseFloat(document.getElementById('m1').value);
  const m2 = parseFloat(document.getElementById('m2').value);
  const m3 = parseFloat(document.getElementById('m3').value);
  const ret = parseFloat(document.getElementById('ret').value);
  const nums = Array.from(selNums).sort((a, b) => a - b);
  const cnt = nums.length;
  const order = {
    id: Date.now(),
    nums: nums,
    startP: startP,
    base: base,
    mult: [m1, m2, m3],
    ret: ret,
    periods: [
      { p: startP, bet: base * m1 * cnt, status: 'pending' },
      { p: startP + 1, bet: base * m2 * cnt, status: 'pending' },
      { p: startP + 2, bet: base * m3 * cnt, status: 'pending' }
    ],
    created: new Date().toISOString()
  };
  orders.push(order);
  save();
  selNums.clear();
  document.querySelectorAll('#numBtns .num-btn').forEach(b => b.classList.remove('sel'));
  document.getElementById('startP').value = '';
  renderOrders();
  autoFillStartP();
}

function markResult(id, idx, status) {
  const o = orders.find(x => x.id === id);
  if (!o) return;
  o.periods[idx].status = status;
  if (o.periods.every(p => p.status !== 'pending')) {
    o.completed = new Date().toISOString();
    history.push(o);
    orders = orders.filter(x => x.id !== id);
  }
  save();
  renderOrders();
  renderStats();
}

function deleteOrder(id) {
  if (!confirm('确定删除？')) return;
  orders = orders.filter(x => x.id !== id);
  save();
  renderOrders();
}

function deleteHist(id) {
  if (!confirm('确定删除？')) return;
  history = history.filter(x => x.id !== id);
  save();
  renderStats();
}

function renderOrders() {
  const c = document.getElementById('orderList');
  if (orders.length === 0) { c.innerHTML = '<div class="empty">暂无下单</div>'; return; }
  let h = '';
  orders.forEach(o => {
    const totalBet = o.periods.reduce((s, p) => s + p.bet, 0);
    h += '<div class="order-card">';
    h += '<div class="order-head"><span class="nums">尾' + o.nums.join(' ') + '</span><span class="info">起始第' + o.startP + '期 | 总投' + totalBet + '元</span></div>';
    h += '<table><tr><th>期数</th><th>下注</th><th>状态</th><th>操作</th></tr>';
    o.periods.forEach((p, i) => {
      const stCls = p.status === 'pending' ? 'st-p' : p.status === 'hit' ? 'st-h' : 'st-m';
      const stTxt = p.status === 'pending' ? '待开奖' : p.status === 'hit' ? '中奖' : '未中';
      h += '<tr><td>' + p.p + '</td><td>' + p.bet + '元</td><td class="' + stCls + '">' + stTxt + '</td>';
      if (p.status === 'pending') {
        h += '<td><button class="btn btn-s btn-sm" onclick="markResult(' + o.id + ',' + i + ',\'hit\')">中</button> ';
        h += '<button class="btn btn-d btn-sm" onclick="markResult(' + o.id + ',' + i + ',\'miss\')">未中</button></td>';
      } else {
        h += '<td>-</td>';
      }
      h += '</tr>';
    });
    h += '</table>';
    h += '<div style="margin-top:8px;text-align:right"><button class="btn btn-d btn-sm" onclick="deleteOrder(' + o.id + ')">删除</button></div>';
    h += '</div>';
  });
  c.innerHTML = h;
}

function renderStats() {
  const totalOrders = history.length;
  const hitOrders = history.filter(h => h.periods.some(p => p.status === 'hit')).length;
  const totalBet = history.reduce((s, h) => s + h.periods.reduce((ss, p) => ss + p.bet, 0), 0);
  const totalReturn = history.reduce((s, h) => {
    return s + h.periods.reduce((ss, p) => {
      if (p.status === 'hit') return ss + p.bet * h.ret;
      return ss;
    }, 0);
  }, 0);
  const profit = totalReturn - totalBet;

  document.getElementById('stats').innerHTML =
    '<div class="stat"><div class="lb">完成订单</div><div class="vl">' + totalOrders + '</div></div>' +
    '<div class="stat"><div class="lb">中奖订单</div><div class="vl green">' + hitOrders + '</div></div>' +
    '<div class="stat"><div class="lb">总投入</div><div class="vl">' + totalBet + '</div></div>' +
    '<div class="stat"><div class="lb">净利润</div><div class="vl ' + (profit >= 0 ? 'green' : 'red') + '">' + (profit >= 0 ? '+' : '') + profit + '</div></div>';

  const hc = document.getElementById('historyList');
  if (history.length === 0) { hc.innerHTML = '<div class="empty">暂无历史</div>'; return; }
  let h = '<table><tr><th>号码</th><th>期数</th><th>结果</th><th>操作</th></tr>';
  history.slice().reverse().forEach(o => {
    const hitCount = o.periods.filter(p => p.status === 'hit').length;
    const result = hitCount > 0 ? '<span class="st-h">中' + hitCount + '</span>' : '<span class="st-m">全未中</span>';
    h += '<tr><td>尾' + o.nums.join(' ') + '</td><td>' + o.startP + '-' + (o.startP + 2) + '</td><td>' + result + '</td>';
    h += '<td><button class="btn btn-d btn-sm" onclick="deleteHist(' + o.id + ')">删</button></td></tr>';
  });
  h += '</table>';
  hc.innerHTML = h;
}

function renderRecords() {
  records.sort((a, b) => b.period - a.period);
  const c = document.getElementById('recList');
  if (records.length === 0) { c.innerHTML = '<div class="empty">暂无记录</div>'; return; }
  let h = '';
  records.forEach(r => {
    h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #e8e4f0">';
    h += '<span style="font-weight:bold;color:#6c5ce7">第' + r.period + '期</span>';
    h += '<span style="font-size:15px;font-weight:bold">' + r.nums.join(' ') + '</span>';
    h += '</div>';
  });
  c.innerHTML = h;
}

function save() {
  localStorage.setItem('orders', JSON.stringify(orders));
  localStorage.setItem('orderHist', JSON.stringify(history));
}

loadRecords();
initNumBtns();
['base', 'm1', 'm2', 'm3', 'ret'].forEach(id => document.getElementById(id).addEventListener('input', updateFormula));
updateFormula();
renderOrders();
renderStats();
autoFillStartP();
</script>
</body>
</html>
