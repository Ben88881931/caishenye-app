<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>接金蛋</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2ff;color:#333;padding:12px;max-width:800px;margin:0 auto}
h1{text-align:center;font-size:18px;color:#6c5ce7;margin-bottom:14px}
.tabs{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.tab{flex:1;min-width:70px;padding:10px 6px;border:1px solid #d5d5f0;border-radius:8px;font-size:12px;cursor:pointer;background:#fff;color:#6c5ce7;text-align:center;white-space:nowrap}
.tab.on{background:#6c5ce7;border-color:#6c5ce7;color:#fff}
.page{display:none}
.page.on{display:block}
.card{background:#fff;border:1px solid #e8e4f0;border-radius:8px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;color:#6c5ce7;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #e8e4f0}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.row label{font-size:13px;color:#666;min-width:70px}
.row input{padding:6px 10px;border:1px solid #d5d5f0;border-radius:6px;font-size:14px;width:80px}
.row input:focus{outline:none;border-color:#6c5ce7}
.row span{font-size:12px;color:#999}
.formula{background:#f5f3ff;border:1px solid #e8e4f0;border-radius:6px;padding:8px 12px;font-size:13px;color:#6c5ce7;margin-top:6px}
.num-btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.num-btn{width:36px;height:36px;border:2px solid #d5d5f0;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;background:#fff;color:#555;display:flex;align-items:center;justify-content:center}
.num-btn.sel{background:#6c5ce7;border-color:#6c5ce7;color:#fff}
.btn{padding:8px 16px;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-weight:bold}
.btn-p{background:#6c5ce7;color:#fff}
.btn-p:hover{background:#5a4bd6}
.btn-d{background:#fee2e2;color:#dc2626}
.btn-s{background:#dcfce7;color:#16a34a}
.btn-sm{padding:4px 8px;font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{padding:6px 8px;text-align:center;border:1px solid #e8e4f0}
th{background:#f5f3ff;color:#888;font-size:11px;font-weight:500}
td{color:#333}
.num{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:4px;margin:0;font-size:13px;font-weight:bold;text-align:center}
.hit{background:#dc2626;color:#fff}
.miss{background:#d1d5db;color:#6b7280;font-size:10px}
.m1{background:#3b82f6}
.m2{background:#22c55e}
.m3{background:#eab308}
.cell{padding:0;border:0;vertical-align:middle}
.hot{background:#22c55e;color:#fff}.warm{background:#3b82f6;color:#fff}.norm{background:#94a3b8;color:#fff}
.cool{background:#eab308;color:#333}.cold{background:#ef4444;color:#fff}.ice{background:#ec4899;color:#fff}
.st-p{color:#f59e0b;font-weight:bold}
.st-h{color:#16a34a;font-weight:bold}
.st-m{color:#dc2626;font-weight:bold}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:#f5f3ff;padding:10px;border-radius:6px;text-align:center}
.stat .lb{font-size:11px;color:#888}
.stat .vl{font-size:18px;font-weight:bold;color:#6c5ce7}
.stat .vl.green{color:#16a34a}
.stat .vl.red{color:#dc2626}
.order-card{border:1px solid #e8e4f0;border-radius:8px;padding:12px;margin-bottom:10px}
.order-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.order-head .nums{font-size:16px;font-weight:bold;color:#6c5ce7}
.order-head .info{font-size:12px;color:#888}
.empty{text-align:center;color:#ccc;padding:20px;font-size:13px}
.legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:11px;color:#888;margin-bottom:10px}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px}
.foot{text-align:center;font-size:11px;color:#ccc;margin-top:10px}
.seg-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.seg-table th,.seg-table td{padding:4px 2px;text-align:center;border:1px solid #e8e4f0}
.seg-table th{background:#f5f3ff;color:#888;font-size:10px}
.seg-cell{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:3px;font-size:10px;font-weight:bold;text-align:center}
.pred-cell{font-size:9px;color:#6c5ce7;font-weight:bold}
.rule-cell{font-size:9px;color:#888}
@media(max-width:500px){
.stats{grid-template-columns:repeat(2,1fr)}
.num-btn{width:32px;height:32px;font-size:14px}
.tab{font-size:11px;padding:8px 4px}
}
</style>
</head>
<body>
<h1>🥚 接金蛋</h1>
<div class="tabs">
  <button class="tab on" onclick="switchPage(0)">尾数分析</button>
  <button class="tab" onclick="switchPage(1)">开奖记录</button>
  <button class="tab" onclick="switchPage(2)">遗漏监控</button>
  <button class="tab" onclick="switchPage(3)">遗漏颜色</button>
  <button class="tab" onclick="switchPage(4)">下单</button>
</div>

<!-- 页面0: 尾数分析器 -->
<div class="page on" id="page0">
  <div class="card">
    <h2>窗口选择</h2>
    <div class="num-btns" id="winBtns"></div>
  </div>
  <div class="card">
    <h2>冷热分布</h2>
    <div class="legend">
      <span><i style="background:#22c55e"></i>热≥70%</span>
      <span><i style="background:#3b82f6"></i>暖60-69%</span>
      <span><i style="background:#94a3b8"></i>平50-59%</span>
      <span><i style="background:#eab308"></i>凉40-49%</span>
      <span><i style="background:#ef4444"></i>冷30-39%</span>
      <span><i style="background:#ec4899"></i>冰<30%</span>
    </div>
    <div style="overflow-x:auto"><table class="seg-table" id="segTable"></table></div>
  </div>
  <div class="card">
    <h2>冰点反弹信号</h2>
    <div id="iceSignals"></div>
  </div>
</div>

<!-- 页面1: 开奖历史记录 -->
<div class="page" id="page1">
  <div class="card">
    <h2>开奖历史</h2>
    <div class="legend">
      <span><i style="background:#dc2626"></i>开出</span>
      <span><i style="background:#d1d5db"></i>未开出(遗漏期数)</span>
    </div>
    <div style="overflow-x:auto"><table id="histTable"></table></div>
    <div class="foot" id="histFoot"></div>
  </div>
</div>

<!-- 页面2: 遗漏监控 -->
<div class="page" id="page2">
  <div class="card">
    <h2>遗漏监控</h2>
    <table id="missTable"></table>
    <div class="foot" id="missFoot"></div>
  </div>
</div>

<!-- 页面3: 遗漏颜色表 -->
<div class="page" id="page3">
  <div class="card">
    <h2>遗漏颜色表</h2>
    <div class="legend">
      <span><i style="background:#dc2626"></i>开出</span>
      <span><i style="background:#3b82f6"></i>遗漏1期</span>
      <span><i style="background:#22c55e"></i>遗漏2期</span>
      <span><i style="background:#eab308"></i>遗漏3期+</span>
    </div>
    <div style="overflow-x:auto"><table id="colorTable"></table></div>
    <div class="foot" id="colorFoot"></div>
  </div>
</div>

<!-- 页面4: 下单系统 -->
<div class="page" id="page4">
  <div class="card">
    <h2>投注设置</h2>
    <div class="row">
      <label>基础金额</label>
      <input type="number" id="base" value="1000" min="1">
      <span>元</span>
    </div>
    <div class="row">
      <label>第1期</label>
      <input type="number" id="m1" value="1" min="0.1" step="0.1">
      <span>倍</span>
      <label style="margin-left:12px">第2期</label>
      <input type="number" id="m2" value="2.25" min="0.1" step="0.1">
      <span>倍</span>
    </div>
    <div class="row">
      <label>第3期</label>
      <input type="number" id="m3" value="30" min="0.1" step="0.1">
      <span>倍</span>
      <label style="margin-left:12px">回报率</label>
      <input type="number" id="ret" value="1.8" min="1" step="0.1">
      <span>倍</span>
    </div>
    <div class="formula" id="formula"></div>
  </div>
  <div class="card">
    <h2>新建下单</h2>
    <div class="row"><label>选择号码</label></div>
    <div class="num-btns" id="orderNumBtns"></div>
    <div class="row">
      <label>起始期数</label>
      <input type="number" id="startP" placeholder="自动填充">
    </div>
    <button class="btn btn-p" onclick="createOrder()">创建下单</button>
  </div>
  <div class="card">
    <h2>当前下单</h2>
    <div id="orderList"></div>
  </div>
  <div class="card">
    <h2>历史统计</h2>
    <div class="stats" id="orderStats"></div>
    <div id="orderHistory"></div>
  </div>
</div>

function renderSegmentTable(){
  var w=currentWindow;
  var data=ALL_DATA[String(w)];
  if(!data)return;
  
  var h='<tr><th>尾号</th>';
  var segCount=data.segs;
  var showCount=Math.min(8,segCount);
  var startSeg=Math.max(0,segCount-showCount);
  
  for(var i=startSeg;i<segCount;i++){
    h+='<th>段'+(i+1)+'</th>';
  }
  h+='<th>转换预测</th><th>出号规律</th></tr>';
  
  for(var d=0;d<10;d++){
    h+='<tr><td style="font-weight:bold">'+d+'</td>';
    
    // 计算每个段口的出号率
    var segs=[];
    for(var st=1;st<=KEYS.length;st+=w){
      var en=Math.min(st+w-1,KEYS.length);
      var cnt=0;
      for(var p=st;p<=en;p++){
        if(DATA[KEYS[p-1]][d]==='1')cnt++;
      }
      var rate=cnt/(en-st+1)*100;
      segs.push({rate:rate,st:st,en:en,cnt:cnt});
    }
    
    for(var i=startSeg;i<segCount;i++){
      var s=segs[i];
      var rate=s.rate;
      var cls=rate>=70?'hot':rate>=60?'warm':rate>=50?'norm':rate>=40?'cool':rate>=30?'cold':'ice';
      h+='<td><span class="seg-cell '+cls+'">'+rate.toFixed(0)+'%</span></td>';
    }
    
    // 转换预测
    var pred=data.preds[String(d)];
    var predStr=pred&&pred.length>0?pred[pred.length-1]:'-';
    h+='<td class="pred-cell">'+predStr+'</td>';
    
    // 出号规律
    var stat=data.stats[String(d)];
    h+='<td class="rule-cell">'+(stat?stat.rule:'')+'</td>';
    
    h+='</tr>';
  }
  h+='</table>';
  document.getElementById('segTable').innerHTML=h;
}

function renderIceSignals(){
  var w=currentWindow;
  var signals=ICE[String(w)];
  var c=document.getElementById('iceSignals');
  
  if(!signals||signals.length===0){
    c.innerHTML='<div class="empty">当前无冰点信号</div>';
    return;
  }
  
  var h='';
  signals.forEach(function(s){
    var clr=s.hit_rate>=90?'#16a34a':s.hit_rate>=80?'#6c5ce7':s.hit_rate>=70?'#f59e0b':'#dc2626';
    h+='<div style="padding:10px;background:#f5f3ff;border-radius:6px;margin-bottom:6px">';
    h+='<b>尾'+s.digit+'</b> '+s.prev_rate+'%→'+s.cur_rate+'% ';
    h+='命中率<b style="color:'+clr+'">'+s.hit_rate+'%</b> ('+s.hits+'/'+s.total+')';
    h+='</div>';
  });
  c.innerHTML=h;
}

function renderHistoryTable(){
  var h='<tr><th>期号</th><th>开奖尾号</th><th>个数</th>';
  for(var d=0;d<10;d++)h+='<th>'+d+'</th>';
  h+='</tr>';
  
  for(var i=KEYS.length-1;i>=0;i--){
    var k=KEYS[i];
    var row=DATA[k];
    var nums=[];
    for(var d=0;d<10;d++){
      if(row[d]==='1')nums.push(d);
    }
    
    h+='<tr><td style="font-weight:bold">'+k+'</td><td>'+nums.join(' ')+'</td><td>'+nums.length+'</td>';
    
    for(var d=0;d<10;d++){
      if(row[d]==='1'){
        h+='<td><span class="num hit">'+d+'</span></td>';
      }else{
        var miss=0;
        for(var p=parseInt(k)-1;p>=1;p--){
          if(DATA[String(p)]&&DATA[String(p)][d]==='1')break;
          miss++;
        }
        h+='<td><span class="num miss">'+(miss+1)+'</span></td>';
      }
    }
    h+='</tr>';
  }
  
  document.getElementById('histTable').innerHTML=h;
  document.getElementById('histFoot').textContent='数据: 第'+KEYS[0]+'-'+KEYS[KEYS.length-1]+'期 | 共'+KEYS.length+'期';
}

function renderMissMonitor(){
  var h='<tr><th>尾号</th><th>当前遗漏</th><th>最大遗漏</th><th>平均遗漏</th></tr>';
  
  for(var d=0;d<10;d++){
    var current=0,max=0,total=0,count=0,lastOpen=-1;
    
    for(var i=0;i<KEYS.length;i++){
      var k=KEYS[i];
      if(DATA[k][d]==='1'){
        if(lastOpen>=0){
          var gap=i-lastOpen-1;
          if(gap>max)max=gap;
          total+=gap;
          count++;
        }
        lastOpen=i;
        current=0;
      }else{
        current++;
      }
    }
    
    if(lastOpen>=0){
      var gap=KEYS.length-1-lastOpen;
      if(gap>max)max=gap;
      if(gap>0){
        total+=gap;
        count++;
      }
    }
    
    var avg=count>0?(total/count).toFixed(1):0;
    h+='<tr><td style="font-weight:bold">'+d+'</td><td style="color:#dc2626;font-weight:bold">'+current+'</td><td>'+max+'</td><td>'+avg+'</td></tr>';
  }
  
  h+='</tr>';
  document.getElementById('missTable').innerHTML=h;
  document.getElementById('missFoot').textContent='数据: 第'+KEYS[0]+'-'+KEYS[KEYS.length-1]+'期 | 共'+KEYS.length+'期';
}

function renderColorTable(){
  var h='<tr><th>期号</th><th>开奖尾号</th><th>个数</th>';
  for(var d=0;d<10;d++)h+='<th>'+d+'</th>';
  h+='</tr>';
  
  var missColor={};
  for(var d=0;d<10;d++){
    missColor[d]={};
    var lastOpen=-1;
    
    for(var i=0;i<KEYS.length;i++){
      var k=KEYS[i];
      if(DATA[k][d]==='1'){
        if(lastOpen>=0){
          var cycleLen=i-lastOpen-1;
          var cls=cycleLen>=3?'m3':cycleLen===2?'m2':'m1';
          for(var p=lastOpen+1;p<i;p++){
            missColor[d][KEYS[p]]=cls;
          }
        }
        lastOpen=i;
      }
    }
    
    if(lastOpen>=0){
      var cycleLen=KEYS.length-1-lastOpen;

      for(var p=lastOpen+1;p<KEYS.length;p++){
        missColor[d][KEYS[p]]=cls;
      }
    }
  }
  
  for(var i=KEYS.length-1;i>=0;i--){

    var row=DATA[k];
    var nums=[];
    for(var d=0;d<10;d++){

}

    base:base,
    mult:[m1,m2,m3],
    ret:ret,
    periods:[
      {p:startP,bet:base*m1*cnt,status:'pending'},
      {p:startP+1,bet:base*m2*cnt,status:'pending'},
      {p:startP+2,bet:base*m3*cnt,status:'pending'}
    ],
    created:new Date().toISOString()
  };
  
  orders.push(order);
  saveOrders();
  selNums.clear();
  document.querySelectorAll('#orderNumBtns .num-btn').forEach(function(b){b.classList.remove('sel');});
  document.getElementById('startP').value='';
  renderOrders();
  autoFillStartP();
}

function markResult(id,idx,status){
  var o=orders.find(function(x){return x.id===id;});
  if(!o)return;
  o.periods[idx].status=status;
  if(o.periods.every(function(p){return p.status!=='pending';})){
    o.completed=new Date().toISOString();
    orderHist.push(o);
    orders=orders.filter(function(x){return x.id!==id;});
  }
  saveOrders();
  renderOrders();
  renderOrderStats();
}

function deleteOrder(id){
  if(!confirm('确定删除？'))return;
  orders=orders.filter(function(x){return x.id!==id;});
  saveOrders();
  renderOrders();
}

function deleteHist(id){
  if(!confirm('确定删除？'))return;
  orderHist=orderHist.filter(function(x){return x.id!==id;});
  saveOrders();
  renderOrderStats();
}

function renderOrders(){
  var c=document.getElementById('orderList');
  if(orders.length===0){c.innerHTML='<div class="empty">暂无下单</div>';return;}
  
  var h='';
  orders.forEach(function(o){
    var totalBet=o.periods.reduce(function(s,p){return s+p.bet;},0);
    h+='<div class="order-card">';
    h+='<div class="order-head"><span class="nums">尾'+o.nums.join(' ')+'</span><span class="info">起始第'+o.startP+'期 | 总投'+totalBet+'元</span></div>';
    h+='<table><tr><th>期数</th><th>下注</th><th>状态</th><th>操作</th></tr>';
    o.periods.forEach(function(p,i){
      var stCls=p.status==='pending'?'st-p':p.status==='hit'?'st-h':'st-m';
      var stTxt=p.status==='pending'?'待开奖':p.status==='hit'?'中奖':'未中';
      h+='<tr><td>'+p.p+'</td><td>'+p.bet+'元</td><td class="'+stCls+'">'+stTxt+'</td>';
      if(p.status==='pending'){
        h+='<td><button class="btn btn-s btn-sm" onclick="markResult('+o.id+','+i+','hit')">中</button> ';
        h+='<button class="btn btn-d btn-sm" onclick="markResult('+o.id+','+i+','miss')">未中</button></td>';
      }else{
        h+='<td>-</td>';
      }
      h+='</tr>';
    });
    h+='</table>';
    h+='<div style="margin-top:8px;text-align:right"><button class="btn btn-d btn-sm" onclick="deleteOrder('+o.id+')">删除</button></div>';
    h+='</div>';
  });
  
  c.innerHTML=h;
}

function renderOrderStats(){
  var totalOrders=orderHist.length;
  var hitOrders=orderHist.filter(function(h){return h.periods.some(function(p){return p.status==='hit';});}).length;
  var totalBet=orderHist.reduce(function(s,h){return s+h.periods.reduce(function(ss,p){return ss+p.bet;},0);},0);
  var totalReturn=orderHist.reduce(function(s,h){
    return s+h.periods.reduce(function(ss,p){
      if(p.status==='hit')return ss+p.bet*h.ret;
      return ss;
    },0);
  },0);
  var profit=totalReturn-totalBet;
  
  document.getElementById('orderStats').innerHTML=
    '<div class="stat"><div class="lb">完成订单</div><div class="vl">'+totalOrders+'</div></div>'+
    '<div class="stat"><div class="lb">中奖订单</div><div class="vl green">'+hitOrders+'</div></div>'+
    '<div class="stat"><div class="lb">总投入</div><div class="vl">'+totalBet+'</div></div>'+
    '<div class="stat"><div class="lb">净利润</div><div class="vl '+(profit>=0?'green':'red')+'">'+(profit>=0?'+':'')+profit+'</div></div>';
  
  var hc=document.getElementById('orderHistory');
  if(orderHist.length===0){hc.innerHTML='<div class="empty">暂无历史</div>';return;}
  
  var h='<table><tr><th>号码</th><th>期数</th><th>结果</th><th>操作</th></tr>';
  orderHist.slice().reverse().forEach(function(o){
    var hitCount=o.periods.filter(function(p){return p.status==='hit';}).length;
    var result=hitCount>0?'<span class="st-h">中'+hitCount+'</span>':'<span class="st-m">全未中</span>';
    h+='<tr><td>尾'+o.nums.join(' ')+'</td><td>'+o.startP+'-'+(o.startP+2)+'</td><td>'+result+'</td>';
    h+='<td><button class="btn btn-d btn-sm" onclick="deleteHist('+o.id+')">删</button></td></tr>';
  });
  h+='</table>';
  hc.innerHTML=h;
}

function saveOrders(){
  localStorage.setItem('orders',JSON.stringify(orders));
  localStorage.setItem('orderHist',JSON.stringify(orderHist));
}

initWindowBtns();
renderSegmentTable();
renderIceSignals();
renderHistoryTable();
renderMissMonitor();
renderColorTable();
initOrderNumBtns();
['base','m1','m2','m3','ret'].forEach(function(id){
  document.getElementById(id).addEventListener('input',updateFormula);
});
updateFormula();
renderOrders();
renderOrderStats();
autoFillStartP();
</script>
</body>
</html>
